### Docker Compose File for the project messaging-api-oban dependencies

services:
  # app:
  #   build: .
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     - DATABASE_URL=postgres://postgres:postgres@postgres:5432/messaging
  #     - SECRET_KEY_BASE=your_secret_key_base_here
  #     - PORT=4000
  #     - FEATURES_CONFIG=/etc/app/features.yaml
  #     - S3_BUCKET=messaging-blobs
  #     - S3_REGION=us-east-1
  #   volumes:
  #     - ./config/features.yaml:/etc/app/features.yaml:ro
  #     - ./priv/storage:/app/priv/storage
  #   depends_on:
  #     - postgres
  #     - redis
  #     - s3_minio

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messaging
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  s3_minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - s3_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  memcached:
    image: memcached:latest
    ports:
      - 11211:11211
    command: memcached -m 64


volumes:
  postgres_data:
  redis_data:
  s3_data: