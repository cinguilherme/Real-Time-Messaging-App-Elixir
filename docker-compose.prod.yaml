# Production Docker Compose Configuration
# For single-VM deployment with all features enabled

version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messaging_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Database Configuration
      DATABASE_URL: postgres://messaging_user:${DB_PASSWORD:-changeme123}@postgres:5432/messaging_prod
      POOL_SIZE: ${POOL_SIZE:-20}
      
      # Application Configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${DOMAIN:-localhost}
      PORT: 4000
      
      # Feature Configuration
      FEATURES_CONFIG: /etc/app/features.yaml
      
      # Storage Configuration
      S3_BUCKET: messaging-blobs
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT: http://s3_minio:9000
      
      # Local storage fallback
      LOCAL_STORAGE_DIR: /app/priv/storage
      LOCAL_STORAGE_URL: ${LOCAL_STORAGE_URL:-http://localhost:4000/storage}
    volumes:
      # Mount custom features configuration if provided
      - ${FEATURES_CONFIG_PATH:-./config/features.yaml}:/etc/app/features.yaml:ro
      # Persistent storage for local blob storage (if not using S3)
      - app_storage:/app/priv/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3_minio:
        condition: service_started
    networks:
      - messaging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: messaging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messaging_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: messaging_prod
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messaging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messaging_user -d messaging_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for PubSub and Caching
  redis:
    image: redis:7-alpine
    container_name: messaging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - messaging_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO (S3-compatible storage for media files)
  s3_minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: messaging_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    volumes:
      - s3_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - messaging_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO Initialization (creates bucket on first run)
  minio_init:
    image: minio/mc:RELEASE.2024-12-13T00-41-31Z
    container_name: messaging_minio_init
    depends_on:
      s3_minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - messaging_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://s3_minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/messaging-blobs --ignore-existing;
      mc anonymous set download myminio/messaging-blobs;
      echo 'MinIO bucket initialized successfully';
      "
    restart: "no"

  # Memcached (Optional: for application-level caching)
  memcached:
    image: memcached:1.6-alpine
    container_name: messaging_memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    command: memcached -m 128
    networks:
      - messaging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional: for SSL termination and load balancing)
  nginx:
    image: nginx:1.25-alpine
    container_name: messaging_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - messaging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-nginx

networks:
  messaging_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  s3_data:
    driver: local
  app_storage:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
